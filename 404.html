<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Usami Rika Dojo</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#8b1a1a">

<!-- Absolute paths: this page is served at arbitrary URLs, so relative ones would break -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fonts/fonts.css">

<style>
  :root {
    --ink: #1a1612;
    --ink-soft: #3d3530;
    --paper: #f7f4ef;
    --red: #8b1a1a;
    --gold: #b8965a;
    --border: rgba(26,22,18,0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    text-align: center;
  }

  main { max-width: 34rem; }

  .code {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(4.5rem, 16vw, 8rem);
    line-height: 1;
    color: var(--red);
    letter-spacing: 0.04em;
  }

  .rule {
    width: 3rem;
    height: 1px;
    margin: 1.75rem auto;
    background: var(--gold);
  }

  .headline {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: clamp(1.5rem, 5vw, 2rem);
    line-height: 1.3;
    margin-bottom: 0.85rem;
  }

  .headline-jp {
    font-family: 'Shippori Mincho', serif;
    font-weight: 400;
    font-size: clamp(1.05rem, 3.6vw, 1.3rem);
    line-height: 1.6;
    color: var(--ink-soft);
    margin-bottom: 2rem;
  }

  .note {
    font-size: 0.85rem;
    line-height: 1.7;
    color: var(--ink-soft);
    margin-bottom: 2.25rem;
  }

  .note-jp {
    font-family: 'Shippori Mincho', serif;
    display: block;
    margin-top: 0.4rem;
  }

  .home {
    display: inline-block;
    padding: 0.85rem 2.25rem;
    border: 1px solid var(--red);
    color: var(--red);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-decoration: none;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  .home:hover, .home:focus-visible {
    background: var(--red);
    color: var(--paper);
  }

  .home-jp {
    font-family: 'Shippori Mincho', serif;
    display: block;
    margin-top: 0.9rem;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    text-decoration: none;
  }

  .home-jp:hover, .home-jp:focus-visible { color: var(--red); }

  @media (prefers-reduced-motion: reduce) {
    .home { transition: none; }
  }
</style>
</head>
<body>
<main>
  <p class="code">404</p>

  <div class="rule" role="presentation"></div>

  <h1 class="headline">This page has moved or no longer exists.</h1>
  <p class="headline-jp" lang="ja">このページは移動したか、削除されました。</p>

  <p class="note">
    You may have followed an older link to the dojo&rsquo;s previous website.
    Everything now lives on a single page.
    <span class="note-jp" lang="ja">以前のホームページのリンクからお越しの可能性があります。現在の内容はすべてトップページにございます。</span>
  </p>

  <a class="home" href="/">Return Home</a>
  <a class="home-jp" href="/" lang="ja">ホームへ戻る</a>
</main>
</body>
</html>
